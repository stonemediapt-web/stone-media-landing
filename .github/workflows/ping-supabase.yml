name: Ping Supabase

on:
  schedule:
    - cron: '0 9 */3 * *'  # de 3 em 3 dias às 9h UTC (o Supabase pausa ao fim de 7 dias sem atividade)
  workflow_dispatch:      # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ping projetos
        run: node ping-supabase.js
